<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chá de bebê do Dante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --bg: #EAF2F6;
    --bg-alt: #D7E7EE;
    --card: #FCFEFF;
    --ink: #263640;
    --ink-soft: #5E747E;
    --sage: #8FA382;
    --sage-dark: #62785A;
    --blush: #8FB8D6;
    --blush-dark: #4E7FA3;
    --rope: #AFC3CC;
    --line: rgba(38,54,64,0.12);
    --radius: 18px;
    --shadow: 0 6px 18px rgba(38,54,64,0.09);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(ellipse at top left, var(--bg-alt) 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:'Nunito Sans', sans-serif;
    min-height:100vh;
    padding: 28px 16px 80px;
  }
  .wrap{ max-width: 880px; margin: 0 auto; }

  /* ---------- Header ---------- */
  header{ text-align:center; margin-bottom: 42px; position:relative; }
  .eyebrow{
    font-weight:800; letter-spacing:.14em; text-transform:uppercase;
    font-size:12px; color:var(--sage-dark); margin-bottom:10px;
  }
  h1{
    font-family:'Fraunces', serif; font-weight:600; font-optical-sizing:auto;
    font-size: clamp(32px, 6vw, 52px); margin:0 0 10px; line-height:1.08;
    color:var(--ink);
  }
  .subtitle{ font-size:16px; color:var(--ink-soft); max-width:480px; margin:0 auto 6px; }
  .event-info{ font-size:14px; color:var(--sage-dark); font-weight:700; margin-top:8px; }
  .intro-note{
    margin: 22px auto 0; max-width:560px; background:var(--card); border-radius:14px;
    padding:14px 18px; font-size:14px; color:var(--ink-soft); box-shadow:var(--shadow);
    border:1px solid var(--line);
  }

  /* ---------- Category ---------- */
  .category{ margin-bottom: 46px; }
  .cat-head{ display:flex; align-items:baseline; gap:12px; margin-bottom: 26px; }
  .cat-head h2{
    font-family:'Fraunces', serif; font-weight:600; font-size:24px; margin:0;
    white-space:nowrap;
  }
  .cat-head .rope{
    flex:1; height:2px; background-image: linear-gradient(to right, var(--rope) 60%, transparent 0%);
    background-size: 10px 2px; background-repeat: repeat-x; opacity:.9; margin-top:6px;
  }
  .cat-head .count{ font-size:13px; color:var(--ink-soft); font-weight:700; white-space:nowrap; }

  .grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr));
    gap: 26px 18px;
  }

  /* ---------- Card (hangs from a peg) ---------- */
  .item{ position:relative; padding-top: 14px; }
  .peg{ position:absolute; top:-2px; left:50%; transform:translateX(-50%); width:26px; height:22px; z-index:2; }
  .item.sage .peg svg .clip{ fill:var(--sage); }
  .item.blush .peg svg .clip{ fill:var(--blush-dark); }

  .card{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    border:1px solid var(--line); padding:20px 16px 16px; text-align:center;
    transform: rotate(-1.1deg); transition: transform .25s ease, box-shadow .25s ease;
    display:flex; flex-direction:column; height:100%;
  }
  .item:nth-child(even) .card{ transform: rotate(1.1deg); }
  .card:hover{ transform: rotate(0deg) translateY(-2px); box-shadow: 0 10px 24px rgba(58,50,38,0.13); }

  .item-name{ font-weight:800; font-size:15px; line-height:1.3; margin-bottom:4px; }
  .item-unit{ font-size:12px; color:var(--ink-soft); margin-bottom:14px; }

  .progress-track{
    height:9px; background:var(--bg-alt); border-radius:6px; overflow:hidden; margin-bottom:8px;
  }
  .progress-fill{ height:100%; border-radius:6px; background:linear-gradient(90deg, var(--sage), var(--sage-dark)); transition: width .4s ease; }
  .item.blush .progress-fill{ background:linear-gradient(90deg, var(--blush), var(--blush-dark)); }

  .progress-label{ font-size:12px; color:var(--ink-soft); font-weight:700; margin-bottom:14px; }
  .progress-label b{ color:var(--ink); }

  .btn{
    margin-top:auto; border:none; border-radius:999px; padding:10px 14px; font-family:inherit;
    font-weight:800; font-size:13.5px; cursor:pointer; transition: transform .15s ease, background .2s ease, color .2s ease;
    width:100%;
  }
  .btn:active{ transform: scale(0.97); }
  .btn-take{ background:var(--sage-dark); color:#fff; }
  .btn-take:hover{ background:var(--sage); }
  .btn-undo{ background:transparent; color:var(--sage-dark); border:1.5px solid var(--sage-dark); }
  .btn-undo:hover{ background: rgba(143,163,130,0.12); }

  .goal-met{ font-size:11.5px; color:var(--sage-dark); font-weight:800; margin-top:6px; }

  /* ---------- Footer / gear ---------- */
  .gear{
    position:fixed; bottom:18px; right:18px; width:44px; height:44px; border-radius:50%;
    background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px;
    color:var(--ink-soft); z-index:50;
  }
  .gear:hover{ color:var(--sage-dark); }

  .toast{
    position:fixed; bottom:74px; right:18px; background:var(--ink); color:#FBF3DE; padding:10px 16px;
    border-radius:10px; font-size:13px; font-weight:700; opacity:0; pointer-events:none; transition:opacity .25s ease;
    z-index:60; max-width:260px;
  }
  .toast.show{ opacity:1; }

  /* ---------- Modal ---------- */
  .modal-bg{
    position:fixed; inset:0; background:rgba(58,50,38,0.45); display:none; align-items:flex-start;
    justify-content:center; padding: 40px 16px; overflow-y:auto; z-index:100;
  }
  .modal-bg.show{ display:flex; }
  .modal{
    background:#fff; border-radius:20px; max-width:520px; width:100%; padding:26px 24px 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }
  .modal h3{ font-family:'Fraunces', serif; font-size:22px; margin:0 0 6px; }
  .modal p.hint{ font-size:13px; color:var(--ink-soft); margin:0 0 18px; }
  .modal label{ font-size:12.5px; font-weight:800; color:var(--ink-soft); display:block; margin:14px 0 5px; }
  .modal input, .modal textarea{
    width:100%; padding:9px 11px; border-radius:9px; border:1.5px solid var(--line); font-family:inherit;
    font-size:14px; background:var(--bg);
  }
  .modal-actions{ display:flex; gap:10px; margin-top:22px; }
  .modal-actions .btn{ width:auto; padding:10px 18px; }
  .btn-secondary{ background:var(--bg-alt); color:var(--ink); }
  .btn-secondary:hover{ background:#ece0bc; }

  .edit-item-row{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .edit-item-row input[type=text]{ flex:2; }
  .edit-item-row input[type=number]{ flex:0 0 70px; }
  .edit-item-row .del{ background:none; border:none; color:var(--blush-dark); font-size:18px; cursor:pointer; flex:0 0 24px; }
  .edit-cat-title{ font-weight:800; font-size:14px; margin:18px 0 8px; }
  .cat-edit-header{ display:flex; align-items:center; gap:8px; margin:20px 0 8px; }
  .cat-name-input{ flex:1; font-weight:800; font-size:14px; }
  .del-cat{ background:none; border:none; color:var(--blush-dark); font-size:20px; cursor:pointer; flex:0 0 26px; line-height:1; }
  .add-row{ background:none; border:1.5px dashed var(--rope); color:var(--ink-soft); border-radius:9px; padding:7px; font-size:12.5px; font-weight:700; cursor:pointer; width:100%; margin-top:4px; }
  .add-cat-row{ margin-top:16px; border-color:var(--sage-dark); color:var(--sage-dark); }
  .danger-zone{ margin-top:26px; padding-top:16px; border-top:1.5px dashed var(--line); }
  .danger-zone .hint{ margin-top:0; }
  .btn-danger{ background:transparent; color:var(--blush-dark); border:1.5px solid var(--blush-dark); width:auto; padding:9px 16px; }
  .btn-danger:hover{ background: rgba(78,127,163,0.1); }

  .loading{ text-align:center; padding:60px 0; color:var(--ink-soft); font-weight:700; }

  .setup-banner{
    max-width:560px; margin:0 auto 28px; background:#FFF7E0; border:1.5px solid #E6C878;
    border-radius:14px; padding:16px 18px; font-size:13.5px; color:#5c4a12; line-height:1.5;
  }
  .setup-banner b{ display:block; margin-bottom:4px; font-size:14.5px; }
  .setup-banner code{ background:rgba(0,0,0,0.06); padding:1px 5px; border-radius:5px; font-size:12.5px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Lista de presentes</div>
    <h1 id="pageTitle">Chá de bebê</h1>
    <p class="subtitle" id="pageSubtitle">Carregando...</p>
    <div class="event-info" id="pageEvent"></div>
    <div class="intro-note">
      Escolha um item abaixo e clique em <b>"Vou levar este"</b>. A quantidade já reservada
      atualiza na hora para todo mundo 💛
    </div>
  </header>

  <div id="setupBanner"></div>
  <div id="content" class="loading">Preparando o varalzinho...</div>
</div>

<div class="gear" id="gearBtn" title="Área do organizador">⚙</div>
<div class="toast" id="toast"></div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalBody"></div>
</div>

<script>
// ======= BANCO DE DADOS (Firebase Realtime Database) =======
const firebaseConfig = {
  apiKey: "AIzaSyBeEItBtl8YqTHNqRsqK2DPVRgMWRtRYaM",
  authDomain: "cha-de-bebe-dante.firebaseapp.com",
  databaseURL: "https://cha-de-bebe-dante-default-rtdb.firebaseio.com",
  projectId: "cha-de-bebe-dante",
  storageBucket: "cha-de-bebe-dante.firebasestorage.app",
  messagingSenderId: "844096780848",
  appId: "1:844096780848:web:79b09027b2e72dc3be4bf5"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const configured = true;

async function kvGet(key){
  const snap = await db.ref(key.replace(/:/g, '/')).once('value');
  const val = snap.val();
  return (val === null || val === undefined) ? null : String(val);
}
async function kvSet(key, value){
  await db.ref(key.replace(/:/g, '/')).set(value);
}
async function kvPatch(key, delta){
  const ref = db.ref(key.replace(/:/g, '/'));
  await ref.transaction(cur => Math.max(0, (cur || 0) + delta));
}
// ==================================================

let config, counts, mine;

function defaultConfig(){
  return {
    title: "Chá de bebê do nosso pequeno Dante",
    subtitle: "Ajude a gente a preparar o ninho do Dante 💙",
    eventInfo: "",
    pin: null,
    categories: [
      { id:'fraldas', name:'Fraldas', accent:'sage', items:[
        {id:'fralda-rn', name:'Fralda RN (recém-nascido)', unit:'pacote', needed:5},
        {id:'fralda-p', name:'Fralda P', unit:'pacote', needed:8},
        {id:'fralda-m', name:'Fralda M', unit:'pacote', needed:10},
        {id:'fralda-g', name:'Fralda G', unit:'pacote', needed:6},
      ]},
      { id:'higiene', name:'Higiene do bebê', accent:'blush', items:[
        {id:'sabonete', name:'Sabonete líquido neutro', unit:'unidade', needed:6},
        {id:'shampoo', name:'Shampoo infantil', unit:'unidade', needed:4},
        {id:'pomada', name:'Pomada para assaduras', unit:'unidade', needed:5},
        {id:'lencos', name:'Lenços umedecidos', unit:'pacote', needed:10},
        {id:'kit-higiene', name:'Kit de higiene (tesoura, escova, pente)', unit:'kit', needed:2},
        {id:'termometro', name:'Termômetro digital', unit:'unidade', needed:1},
      ]},
      { id:'roupas', name:'Roupinhas', accent:'sage', items:[
        {id:'body-rn', name:'Body manga curta RN', unit:'unidade', needed:6},
        {id:'body-p', name:'Body manga longa P', unit:'unidade', needed:6},
        {id:'macacao-m', name:'Macacão M', unit:'unidade', needed:5},
        {id:'meias', name:'Meias', unit:'par', needed:8},
        {id:'toalha', name:'Toalha com capuz', unit:'unidade', needed:3},
        {id:'manta', name:'Manta / cobertor', unit:'unidade', needed:2},
      ]},
    ]
  };
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}

function pegSVG(){
  return `<svg viewBox="0 0 26 22" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="11" y="0" width="4" height="14" fill="#B8AD8C"/>
    <path class="clip" d="M4 12c0-5 4-9 9-9s9 4 9 9-4 8-9 8-9-3-9-8z" opacity="0.95"/>
    <rect x="12" y="9" width="2" height="9" fill="#3A3226" opacity="0.25"/>
  </svg>`;
}

async function loadAll(){
  mine = JSON.parse(localStorage.getItem('my_reservations') || '[]');

  try{
    const raw = await kvGet('config');
    config = raw ? JSON.parse(raw) : null;
    if(!config){
      config = defaultConfig();
      await kvSet('config', JSON.stringify(config));
    }
  } catch(e){
    config = defaultConfig();
    showToast('Não consegui conectar ao banco. Tenta recarregar a página.');
  }

  counts = {};
  const allItemIds = config.categories.flatMap(c => c.items.map(i => i.id));
  db.ref('counts').on('value', snap => {
    const raw = snap.val() || {};
    counts = {};
    allItemIds.forEach(id => { counts[id] = raw[id] || 0; });
    render();
  });

  render();
}

function render(){
  document.getElementById('pageTitle').textContent = config.title;
  document.getElementById('pageSubtitle').textContent = config.subtitle;
  document.getElementById('pageEvent').textContent = config.eventInfo || '';

  const content = document.getElementById('content');
  content.className = '';
  content.innerHTML = '';

  config.categories.forEach(cat=>{
    const catEl = document.createElement('div');
    catEl.className = 'category';

    const totalNeeded = cat.items.reduce((s,i)=>s+i.needed,0);
    const totalGot = cat.items.reduce((s,i)=>s+Math.min(counts[i.id]||0, i.needed),0);

    catEl.innerHTML = `
      <div class="cat-head">
        <h2>${escapeHTML(cat.name)}</h2>
        <div class="rope"></div>
        <div class="count">${totalGot}/${totalNeeded}</div>
      </div>
      <div class="grid"></div>
    `;
    const grid = catEl.querySelector('.grid');

    cat.items.forEach(item=>{
      const reserved = counts[item.id] || 0;
      const pct = Math.min(100, Math.round((reserved/item.needed)*100));
      const isMine = mine.includes(item.id);
      const met = reserved >= item.needed;

      const el = document.createElement('div');
      el.className = 'item ' + (cat.accent||'sage');
      el.innerHTML = `
        <div class="peg">${pegSVG()}</div>
        <div class="card">
          <div class="item-name">${escapeHTML(item.name)}</div>
          <div class="item-unit">${escapeHTML(item.unit)}</div>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="progress-label"><b>${reserved}</b> de ${item.needed} reservado${item.needed>1?'s':''}</div>
          ${met ? '<div class="goal-met">Já temos o suficiente, mas pode trazer se quiser! 💚</div>' : ''}
          <button class="btn ${isMine ? 'btn-undo' : 'btn-take'}" data-id="${item.id}">
            ${isMine ? 'Combinado — desfazer' : 'Vou levar este'}
          </button>
        </div>
      `;
      el.querySelector('button').addEventListener('click', ()=>toggleItem(item.id));
      grid.appendChild(el);
    });

    content.appendChild(catEl);
  });
}

function escapeHTML(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function toggleItem(itemId){
  if(!configured){ showToast('Configure o banco primeiro (veja o aviso no topo).'); return; }

  const wasMine = mine.includes(itemId);

  // Antes de confirmar uma reserva (não ao desfazer), se o item for da categoria
  // "Fraldas", mostra um aviso sutil sobre guardar a nota fiscal.
  if(!wasMine){
    const cat = config.categories.find(c => c.items.some(i => i.id === itemId));
    if(cat && cat.id === 'fraldas'){
      showFraldaNote(itemId);
      return;
    }
  }

  await commitToggle(itemId);
}

function showFraldaNote(itemId){
  modalBody.innerHTML = `
    <h3>Vou levar este 💛</h3>
    <p class="hint">Combinado! Só uma dica: se puder, guarda a notinha da compra — assim, se por acaso essa marca não combinar com a pele do bebê, fica mais fácil trocar.</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Voltar</button>
      <button class="btn btn-take" id="confirmFraldaBtn">Confirmar</button>
    </div>
  `;
  openModal();
  document.getElementById('confirmFraldaBtn').addEventListener('click', async ()=>{
    closeModal();
    await commitToggle(itemId);
  });
}

async function commitToggle(itemId){
  const idx = mine.indexOf(itemId);
  const wasMine = idx >= 0;
  const delta = wasMine ? -1 : 1;

  if(wasMine) mine.splice(idx,1); else mine.push(itemId);
  localStorage.setItem('my_reservations', JSON.stringify(mine));
  counts[itemId] = Math.max(0, (counts[itemId]||0) + delta);
  render();

  try{
    await kvPatch('counts:' + itemId, delta);
    showToast(wasMine ? 'Reserva desfeita.' : 'Muito obrigado! Reserva registrada 💛');
  } catch(e){
    // reverte a mudança otimista — o botão não pode dizer "combinado" se não salvou de verdade
    if(wasMine) mine.push(itemId); else mine.splice(mine.indexOf(itemId),1);
    localStorage.setItem('my_reservations', JSON.stringify(mine));
    counts[itemId] = Math.max(0, (counts[itemId]||0) - delta);
    render();
    showToast('Não deu pra salvar (conexão instável). Tenta clicar de novo.');
  }
}

/* ---------------- Organizer modal ---------------- */
const modalBg = document.getElementById('modalBg');
const modalBody = document.getElementById('modalBody');

document.getElementById('gearBtn').addEventListener('click', ()=>{
  if(!configured){ showToast('Configure o banco primeiro (veja o aviso no topo da página).'); return; }
  if(!config.pin){ openSetPin(); }
  else { openEnterPin(); }
});
modalBg.addEventListener('click', (e)=>{ if(e.target===modalBg) closeModal(); });

function openModal(){ modalBg.classList.add('show'); }
function closeModal(){ modalBg.classList.remove('show'); }

function openSetPin(){
  modalBody.innerHTML = `
    <h3>Área do organizador</h3>
    <p class="hint">Crie uma senha simples só sua, pra poder editar a lista depois sem que os convidados mexam nela.</p>
    <label>Senha (mín. 4 caracteres)</label>
    <input type="password" id="newPin" placeholder="Ex: 1234">
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-take" id="savePinBtn">Criar e entrar</button>
    </div>
  `;
  openModal();
  document.getElementById('savePinBtn').addEventListener('click', async ()=>{
    const val = document.getElementById('newPin').value.trim();
    if(val.length < 4){ showToast('Use pelo menos 4 caracteres.'); return; }
    config.pin = val;
    try{ await kvSet('config', JSON.stringify(config)); }catch(e){ showToast('Não consegui salvar a senha.'); }
    openEditPanel();
  });
}

function openEnterPin(){
  modalBody.innerHTML = `
    <h3>Área do organizador</h3>
    <p class="hint">Digite sua senha para editar a lista.</p>
    <label>Senha</label>
    <input type="password" id="pinInput" placeholder="Sua senha">
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-take" id="checkPinBtn">Entrar</button>
    </div>
  `;
  openModal();
  document.getElementById('checkPinBtn').addEventListener('click', ()=>{
    const val = document.getElementById('pinInput').value.trim();
    if(val === config.pin){ openEditPanel(); }
    else { showToast('Senha incorreta.'); }
  });
}

function openEditPanel(){
  let catsHTML = '';
  config.categories.forEach((cat, ci)=>{
    catsHTML += `
      <div class="cat-edit-header">
        <input type="text" class="cat-name-input" value="${escapeHTML(cat.name)}" data-catname="${ci}">
        <button class="del-cat" data-delcat="${ci}" title="Remover categoria inteira">×</button>
      </div>`;
    cat.items.forEach((item, ii)=>{
      catsHTML += `
        <div class="edit-item-row">
          <input type="text" value="${escapeHTML(item.name)}" data-c="${ci}" data-i="${ii}" data-f="name">
          <input type="number" min="0" value="${item.needed}" data-c="${ci}" data-i="${ii}" data-f="needed">
          <button class="del" data-c="${ci}" data-i="${ii}" title="Remover">×</button>
        </div>`;
    });
    catsHTML += `<button class="add-row" data-addcat="${ci}">+ adicionar item nesta categoria</button>`;
  });
  catsHTML += `<button class="add-row add-cat-row" id="addCategoryBtn">+ adicionar nova categoria</button>`;

  modalBody.innerHTML = `
    <h3>Editar lista</h3>
    <p class="hint">Ajuste título, categorias, quantidades e itens. As mudanças aparecem pra todo mundo.</p>
    <label>Título</label>
    <input type="text" id="editTitle" value="${escapeHTML(config.title)}">
    <label>Subtítulo</label>
    <input type="text" id="editSubtitle" value="${escapeHTML(config.subtitle)}">
    <label>Data / local (opcional)</label>
    <input type="text" id="editEvent" value="${escapeHTML(config.eventInfo||'')}" placeholder="Ex: 15 de agosto, na casa da vovó">
    ${catsHTML}
    <div class="danger-zone">
      <div class="edit-cat-title">Zona de reset</div>
      <p class="hint">Zera todas as reservas feitas até agora (útil pra limpar testes antes de mandar o link de verdade). Essa ação não pode ser desfeita.</p>
      <button class="btn btn-danger" id="resetAllBtn">Zerar todas as reservas</button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Fechar</button>
      <button class="btn btn-take" id="saveEditBtn">Salvar tudo</button>
    </div>
  `;
  openModal();

  modalBody.querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const c = +btn.dataset.c, i = +btn.dataset.i;
      config.categories[c].items.splice(i,1);
      openEditPanel();
    });
  });

  modalBody.querySelectorAll('.del-cat').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const c = +btn.dataset.delcat;
      const name = config.categories[c].name;
      if(confirm('Remover a categoria "' + name + '" e todos os itens dela? Essa ação some ao salvar.')){
        config.categories.splice(c,1);
        openEditPanel();
      }
    });
  });

  modalBody.querySelectorAll('.add-row').forEach(btn=>{
    if(btn.id === 'addCategoryBtn') return; // tratado separadamente abaixo
    btn.addEventListener('click', ()=>{
      const c = +btn.dataset.addcat;
      config.categories[c].items.push({id: 'item-' + Date.now(), name:'Novo item', unit:'unidade', needed:1});
      openEditPanel();
    });
  });

  document.getElementById('addCategoryBtn').addEventListener('click', ()=>{
    const name = prompt('Nome da nova categoria (ex: Brinquedos):');
    if(name && name.trim()){
      config.categories.push({
        id: 'cat-' + Date.now(),
        name: name.trim(),
        accent: config.categories.length % 2 === 0 ? 'sage' : 'blush',
        items: []
      });
      openEditPanel();
    }
  });

  document.getElementById('resetAllBtn').addEventListener('click', async ()=>{
    if(!confirm('Tem certeza? Isso vai zerar TODAS as reservas pra todo mundo. Essa ação não pode ser desfeita.')) return;
    try{
      const allItemIds = config.categories.flatMap(c => c.items.map(i => i.id));
      const updates = {};
      allItemIds.forEach(id => { updates['counts/' + id] = 0; });
      await db.ref().update(updates);
      mine = [];
      localStorage.setItem('my_reservations', JSON.stringify(mine));
      showToast('Reservas zeradas!');
      closeModal();
      render();
    } catch(e){
      showToast('Não consegui zerar, tenta de novo.');
    }
  });

  document.getElementById('saveEditBtn').addEventListener('click', async ()=>{
    config.title = document.getElementById('editTitle').value.trim() || 'Chá de bebê';
    config.subtitle = document.getElementById('editSubtitle').value.trim();
    config.eventInfo = document.getElementById('editEvent').value.trim();

    modalBody.querySelectorAll('[data-catname]').forEach(inp=>{
      config.categories[+inp.dataset.catname].name = inp.value.trim() || 'Categoria';
    });
    modalBody.querySelectorAll('[data-f="name"]').forEach(inp=>{
      config.categories[+inp.dataset.c].items[+inp.dataset.i].name = inp.value.trim() || 'Item';
    });
    modalBody.querySelectorAll('[data-f="needed"]').forEach(inp=>{
      const v = Math.max(0, parseInt(inp.value)||0);
      config.categories[+inp.dataset.c].items[+inp.dataset.i].needed = v;
    });

    try{
      await kvSet('config', JSON.stringify(config));
      showToast('Lista atualizada!');
      closeModal();
      render();
    } catch(e){
      showToast('Não consegui salvar, tenta de novo.');
    }
  });
}

loadAll();
</script>
</body>
</html>
